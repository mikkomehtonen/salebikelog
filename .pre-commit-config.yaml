repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
  - repo: local
    hooks:
      - id: check-ascii
        name: check-ascii
        entry: bash scripts/check-ascii.sh
        language: system
        pass_filenames: true
